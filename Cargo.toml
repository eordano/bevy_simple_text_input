[package]
name = "bevy_simple_text_input"
version = "0.11.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bevy plugin for a simple single-line text input widget."
repository = "https://github.com/rparrett/bevy_simple_text_input"
homepage = "https://github.com/rparrett/bevy_simple_text_input"
documentation = "https://docs.rs/bevy_simple_text_input"
keywords = ["bevy", "gamedev"]
categories = ["game-development"]
readme = "README.md"
exclude = [".github"]

[features]
default = ["std", "clipboard"]
std = ["bevy/std"]
libm = ["bevy/libm"]
# In 0.19 the OS clipboard is handled natively by `bevy_text`
# (`EditableText` copy/cut/paste) behind bevy's `system_clipboard` feature.
# This crate no longer ships its own clipboard implementation.
clipboard = ["bevy/system_clipboard"]

[dependencies]

[dependencies.bevy]
version = "0.19.0"
default-features = false
features = [
    "bevy_ui",
    "bevy_ui_render",
    "bevy_asset",
    "bevy_text",
    "bevy_sprite",
    "bevy_window",
    "bevy_log",
]

[dev-dependencies.bevy]
version = "0.19.0"
default-features = true

[lints.rust]
missing_docs = "warn"

[lints.clippy]
type_complexity = "allow"
